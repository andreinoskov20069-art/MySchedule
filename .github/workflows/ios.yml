name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          brew install autoconf automake libtool pkg-config
          brew link libtool
          pip install Cython==3.2.0
          pip install kivy-ios

      - name: Build iOS dependencies
        run: |
          toolchain build python3 kivy

      - name: Prepare application
        run: |
          mkdir -p app
          cp main.py app/main.py

      - name: Create Xcode project
        run: |
          toolchain create MySchedule "$PWD/app"

      - name: Show Xcode project
        run: |
          cd MySchedule-ios
          xcodebuild -list

      - name: Build iOS application
        run: |
          cd MySchedule-ios
          xcodebuild \
            -project MySchedule.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Find application
        run: |
          echo "=== Searching for .app files ==="
          find . -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app file was found"
            echo "=== Build directory ==="
            find . -maxdepth 5 -type d -print
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/MySchedule.app

          echo "=== Creating IPA ==="
          zip -r MySchedule.ipa Payload

          echo "=== IPA created ==="
          ls -lh MySchedule.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySchedule-IPA
          path: MySchedule.ipa

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: MySchedule-APP
          path: Payload/MySchedule.app
